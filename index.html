<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trappisten-Karte</title>

  <!-- MapLibre GL per CDN, kein npm/Build-Schritt. Eigener Vektorstil (data/map-style.json)
       auf Basis der freien OpenFreeMap-Kacheln, statt fertigem Tile-Design. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="map"></main>

  <button type="button" class="top-cross" aria-label="Zur Kartenansicht zurückkehren" data-nav="map">
    <span class="top-cross__bar top-cross__bar--v"></span>
    <span class="top-cross__bar top-cross__bar--h"></span>
  </button>

  <header class="site-header">
    <h1>Trappisten-Karte</h1>
    <p>Geschichte, Abteien und Biere der Trappisten-Brauereien</p>
    <nav class="site-nav">
      <button type="button" class="site-nav__link is-active" data-nav="map">Karte</button>
      <button type="button" class="site-nav__link" data-nav="school">Schule</button>
    </nav>
  </header>

  <div id="book-overlay" class="book-overlay" hidden></div>

  <div id="timeline-mode" class="timeline-mode" hidden>
    <button type="button" class="timeline-mode__close" aria-label="Zeitstrahl verlassen">&times;</button>
    <div class="timeline-axis">
      <div class="timeline-axis__line"></div>
      <ol class="timeline-axis__points"></ol>
    </div>
    <div class="timeline-panel">
      <div class="timeline-panel__year"></div>
      <h2 class="timeline-panel__title"></h2>
      <p class="timeline-panel__text"></p>
      <div class="timeline-panel__controls">
        <button type="button" class="timeline-panel__prev">&larr; Zurück</button>
        <button type="button" class="timeline-panel__next">Weiter &rarr;</button>
      </div>
    </div>
  </div>

  <div id="glossary-popover" class="glossary-popover" hidden>
    <button type="button" class="glossary-popover__close" aria-label="Schließen">&times;</button>
    <img class="glossary-popover__image" alt="" hidden />
    <p class="glossary-popover__credit"></p>
    <h3 class="glossary-popover__term"></h3>
    <p class="glossary-popover__description"></p>
  </div>

  <script type="module" src="js/book.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
