<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trappisten-Karte</title>
  <meta name="description" content="Geschichte, Abteien und Biere der Trappisten-Brauereien" />
  <meta property="og:title" content="Trappisten-Karte" />
  <meta property="og:description" content="Geschichte, Abteien und Biere der Trappisten-Brauereien" />
  <meta property="og:type" content="website" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231c1f1a'/%3E%3Crect x='14' y='5' width='4' height='22' fill='%23e9e4d4'/%3E%3Crect x='8' y='11' width='16' height='4' fill='%23e9e4d4'/%3E%3C/svg%3E"
  />

  <!-- MapLibre GL per CDN, kein npm/Build-Schritt. Eigener Vektorstil (data/map-style.json)
       auf Basis der freien OpenFreeMap-Kacheln, statt fertigem Tile-Design. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="map"></main>

  <button type="button" class="top-cross" data-i18n-aria="cross_aria" aria-label="Zur Kartenansicht zurückkehren" data-nav="map">
    <span class="top-cross__bar top-cross__bar--v"></span>
    <span class="top-cross__bar top-cross__bar--h"></span>
  </button>

  <header class="site-header">
    <h1 data-i18n="title">Trappisten-Karte</h1>
    <p data-i18n="subtitle">Geschichte, Abteien und Biere der Trappisten-Brauereien</p>
    <nav class="site-nav">
      <button type="button" class="site-nav__link is-active" data-nav="map" data-i18n="nav_map">Karte</button>
      <button type="button" class="site-nav__link" data-nav="school" data-i18n="nav_school">Schule</button>
      <select id="lang-select" class="lang-select" data-i18n-aria="lang_label" aria-label="Sprache"></select>
    </nav>
    <label class="sensitive-toggle">
      <input type="checkbox" id="sensitive-toggle-input" />
      <span data-i18n="sensitive_toggle">Auch belastende Kapitel zeigen</span>
    </label>
  </header>

  <div id="content-warning" class="content-warning" hidden>
    <div class="content-warning__card">
      <h3 data-i18n="warn_title">Inhaltswarnung</h3>
      <p data-i18n="warn_text"></p>
      <div class="content-warning__controls">
        <button type="button" class="content-warning__cancel" data-i18n="warn_cancel">Abbrechen</button>
        <button type="button" class="content-warning__confirm" data-i18n="warn_confirm">Trotzdem zeigen</button>
      </div>
    </div>
  </div>

  <div id="lang-picker" class="lang-picker" hidden>
    <div class="lang-picker__card">
      <div class="lang-picker__cross" aria-hidden="true"></div>
      <h2 class="lang-picker__title">Sprache · Taal · Langue · Language · Jazyk</h2>
      <ul class="lang-picker__list"></ul>
    </div>
  </div>

  <div id="book-overlay" class="book-overlay" hidden></div>

  <div id="timeline-mode" class="timeline-mode" hidden>
    <button type="button" class="timeline-mode__close" data-i18n-aria="timeline_close" aria-label="Zeitstrahl verlassen">&times;</button>
    <div class="timeline-axis">
      <div class="timeline-axis__line"></div>
      <ol class="timeline-axis__points"></ol>
      <p class="timeline-axis__hidden-note" hidden></p>
    </div>
    <div class="timeline-panel">
      <div class="timeline-panel__year"></div>
      <h2 class="timeline-panel__title"></h2>
      <p class="timeline-panel__warning" hidden></p>
      <p class="timeline-panel__text"></p>
      <div class="timeline-panel__controls">
        <button type="button" class="timeline-panel__prev">&larr;</button>
        <button type="button" class="timeline-panel__next">&rarr;</button>
      </div>
    </div>
  </div>

  <div id="glossary-popover" class="glossary-popover" hidden>
    <button type="button" class="glossary-popover__close" data-i18n-aria="close" aria-label="Schließen">&times;</button>
    <img class="glossary-popover__image" alt="" hidden />
    <p class="glossary-popover__credit"></p>
    <h3 class="glossary-popover__term"></h3>
    <p class="glossary-popover__description"></p>
  </div>

  <div id="devtools-cross" class="devtools-cross" hidden>
    <div class="devtools-cross__symbol" aria-hidden="true"></div>
    <blockquote class="devtools-cross__quote"></blockquote>
    <p class="devtools-cross__source"></p>
  </div>

  <noscript><p style="position:fixed;top:40%;left:0;right:0;text-align:center;font-family:serif">JavaScript</p></noscript>

  <script type="module" src="js/guard.js"></script>
  <script type="module" src="js/book.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
